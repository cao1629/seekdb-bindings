[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pylibseekdb"
version = "0.1.0"
description = "Python bindings for the seekdb C client"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "cao1629" }]

[tool.scikit-build]
cmake.source-dir = "."
build.targets    = ["pylibseekdb"]
wheel.packages   = ["pylibseekdb"]
build-dir        = "build/{wheel_tag}"

[tool.cibuildwheel]
build  = "cp311-*"
skip   = "*-musllinux_*"

environment = { PIP_INDEX_URL = "https://pypi.tuna.tsinghua.edu.cn/simple/" }

repair-wheel-command = ""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-build = [
    "yum install -y libaio",
    "cp /usr/lib64/libaio.so.1 /project/build/",
    "patchelf --set-rpath '$ORIGIN' /project/build/seekdb",
]

repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { PIP_INDEX_URL = "https://pypi.tuna.tsinghua.edu.cn/simple/", MACOSX_DEPLOYMENT_TARGET = "15.5" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
repair-wheel-command = ""
